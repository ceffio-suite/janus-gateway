name: build

# Builds and publishes the Janus image for Ceffio.
#
# Two triggers:
#   - push on main        → "latest" tag (unused in production)
#   - git tag (v1.3.0-*)  → versioned tag, the one Ceffio pins
#
# The image targets linux/amd64: the Ceffio VM (k3s) is x86_64. GitHub Actions
# provides amd64 runners, so no cross-architecture build is required.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install buildx
        uses: docker/setup-buildx-action@v3

      # We publish with a DEDICATED token (GHCR_TOKEN secret) and not the
      # GITHUB_TOKEN: the ceffio-suite organization policy imposes READ
      # permissions on the automatic token ("Write permissions for workflows
      # are disabled by the organization"), which would make the image push
      # fail with "permission_denied".
      #
      # We prefer a dedicated token over loosening the org policy: the
      # GITHUB_TOKEN restriction is a good practice, we do not weaken it to
      # make a build pass.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build compiles usrsctp, libsrtp and Janus from source:
          # allow about ten minutes cold.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY