name: build

# Builds and publishes the Janus image for Ceffio.
#
# Two triggers:
#   - push on main        → "latest" tag (unused in production)
#   - git tag (v1.3.0-*)  → versioned tag, the one Ceffio pins
#
# The image targets linux/amd64: the Ceffio VM (k3s) is x86_64. GitHub Actions
# provides amd64 runners, so no cross-architecture build is required.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # A VULNERABILITY FOUND AFTER THE RELEASE MUST BE SEEN WITHOUT WAITING FOR THE
  # NEXT ONE. Weekly, on the published image.
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # We publish with a DEDICATED token (GHCR_TOKEN secret) and not the
      # GITHUB_TOKEN: the ceffio-suite organization policy imposes READ
      # permissions on the automatic token ("Write permissions for workflows
      # are disabled by the organization"), which would make the image push
      # fail with "permission_denied".
      #
      # We prefer a dedicated token over loosening the org policy: the
      # GITHUB_TOKEN restriction is a good practice, we do not weaken it to
      # make a build pass.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          # PUSH ONLY WHEN THERE IS SOMETHING TO PUBLISH. On a pull request,
          # none of the metadata rules matches: `type=ref,event=branch` does
          # not fire on a PR, `semver` needs a tag, and `latest` is gated to
          # the default branch. The tag list comes out empty and buildx fails
          # with "tag is needed when pushing to registry" — which is what
          # turned every PR red.
          #
          # Pushing from a PR would also be wrong on its own terms: an
          # unreviewed commit would overwrite the image a production install
          # pulls. A PR builds to prove it compiles; only main and tags publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # THE IMAGE CARRIES ITS BILL OF MATERIALS AND ITS PROVENANCE, so an
          # operator can ask the registry what is inside, and how it was built,
          # without trusting a release note.
          sbom: true
          provenance: mode=max
          # The build compiles usrsctp, libsrtp and Janus from source:
          # allow about ten minutes cold.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image carries its SBOM and its provenance
        # "The build said pushed" proves nothing about the attestation; this
        # reads it back from the registry, the way an operator would.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          for ATTESTATION in SBOM Provenance; do
            VALEUR="$(docker buildx imagetools inspect "$TAG" --format "{{ json .${ATTESTATION} }}")"
            echo "${ATTESTATION} of ${TAG}: $(echo "$VALEUR" | head -c 300)"
            if [ -z "$VALEUR" ] || [ "$VALEUR" = "null" ]; then
              echo "::error::${TAG} carries no ${ATTESTATION} attestation"
              exit 1
            fi
          done

      - name: Summary
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # THE IMAGE WE PUBLISH IS SCANNED, AND STAYS SCANNED: the tag does not change,
  # the vulnerability database does.
  scan:
    name: scan the published image
    needs: build
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Scan the image
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # ON A TAG, THAT TAG; ON THE WEEKLY RUN, `latest` — the version an
          # installation pulls today.
          image: ghcr.io/ceffio-suite/janus-gateway:${{ github.event_name == 'schedule' && 'latest' || github.ref_name }}
          # THE SAME RULE AS THE REST OF THE SUITE: only a CRITICAL finding WITH a
          # fix stops the job. Everything else is reported.
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: grype-janus.json
          grype-version: v0.121.0
          cache-db: true

      - name: Summarise the scan
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s grype-janus.json ]; then
            echo "### Grype, image janus-gateway — aucun rapport produit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - grype-janus.json >> "$GITHUB_STEP_SUMMARY" <<'FIN_PYTHON'
          import json, sys
          d = json.load(open(sys.argv[1]))
          matches = d.get("matches") or []
          ordre = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          compte = {s: [0, 0] for s in ordre}
          for m in matches:
              sev = (m.get("vulnerability") or {}).get("severity") or "Unknown"
              fixe = ((m.get("vulnerability") or {}).get("fix") or {}).get("state") == "fixed"
              if sev not in compte:
                  sev = "Unknown"
              compte[sev][0] += 1
              if fixe:
                  compte[sev][1] += 1
          print("### Grype, image janus-gateway")
          print()
          print("| Sévérité | Total | Avec correctif |")
          print("|---|---|---|")
          for s in ordre:
              total, fixe = compte[s]
              if total or s == "Critical":
                  print("| %s | %d | %d |" % (s, total, fixe))
          print()
          print("%d vulnérabilité(s) au total, %d avec un correctif."
                % (sum(c[0] for c in compte.values()), sum(c[1] for c in compte.values())))
          FIN_PYTHON
