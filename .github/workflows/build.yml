name: build

# Construit et publie l'image Janus pour Ceffio.
#
# Deux déclencheurs :
#   - push sur main        → tag « latest » (non utilisé en production)
#   - tag git (v1.3.0-*)   → tag versionné, celui que Ceffio épingle
#
# L'image cible linux/amd64 : la VM Ceffio (k3s) est en x86_64. GitHub Actions
# fournit des runners amd64, donc aucun build cross-architecture n'est requis.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer buildx
        uses: docker/setup-buildx-action@v3

      # On publie avec un token DÉDIÉ (secret GHCR_TOKEN) et non avec le
      # GITHUB_TOKEN : la politique de l'organisation ceffio-suite impose des
      # permissions en LECTURE au token automatique (« Write permissions for
      # workflows are disabled by the organization »), ce qui ferait échouer le
      # push de l'image en « permission_denied ».
      #
      # On préfère un token dédié à un assouplissement de la politique d'org :
      # la restriction du GITHUB_TOKEN est une bonne pratique, on ne l'affaiblit
      # pas pour faire passer un build.
      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le build compile usrsctp, libsrtp et Janus depuis les sources :
          # comptez une dizaine de minutes à froid.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY